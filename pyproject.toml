[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rafe-gui"
version = "0.1.0"
description = "Real-Sim GUI fidelity experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "Pillow>=11,<13"]

[project.optional-dependencies]
encoders = ["torch>=2.6", "torchvision>=0.21", "transformers==4.57.6", "huggingface-hub==0.36.2", "safetensors>=0.8,<1"]
ocr = ["opencv-python-headless>=4.10", "rapidocr==3.10.0", "onnxruntime>=1.20"]
easyocr = ["easyocr>=1.7,<2"]
vlm = ["openai>=1,<3"]
analysis = ["matplotlib>=3.10,<4"]
dev = ["pytest>=8,<10"]

[project.scripts]
rafe = "rafe_gui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rafe_gui = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]


norecursedirs = ["archive", "data", "models", "dist", ".tools"]
addopts = "--basetemp=.pytest-tmp --tb=short"
